# FRX fixed parameters — Blueprint v3.0, Sections 3, 6, 8, 9, 12, 14.
# "locked" values may change only through a new protocol version.
# "<Gx>" values are set at that gate by the rule cited and committed before freeze (G5).
protocol_version: "3.0"

timing:                      # locked
  delay_s: 60                # delta
  grace_s: 10                # g  (g < delta)
  epsilon_s: 5
  delay_tolerance_s: 2
  settle_s: 10
  load_warmup_s: 20
  load_warmup_block_start_s: 60
  manipulation_window_s: 15
  termination_poll_interval_s: 0.5
  readiness_timeout_s: 2             # G3: 3 x max observed in Q-a/Q-b (0.518 s), rounded up
  termination_timeout_s: 16          # G3: 3 x max delete -> 404 (5.06 s), rounded up
  namespace_delete_timeout_s: 19     # G3: 3 x max (6.04 s), rounded up
  control_idle_s: 4.1                # G3: median ACTION_REQUEST -> TERMINATION_CONFIRMED in Q-a/Q-b (n = 24; 3.59-5.62 s)

target_pod:                  # locked
  termination_grace_period_s: 1
  sidecars: none
  image_pull_policy: IfNotPresent
  image_digest: "docker.io/library/debian@sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad"   # G2 (debian:trixie-slim)
  exec_binary: /usr/bin/echo
  namespace_pattern: "frx-{short_uuid}"
  pod_pattern: "tgt-{short_uuid}"
  nonce_bits: 128
  marker_prefix: "FRX-"

load:
  namespace: frx-load
  configmap: frx-load-rate
  manipulation_tolerance: 0.20       # locked: +/- 20 % of target, both sources
  # G3: Section 4.3 rule on load_map.json fit; operating_points.json (sha256 in protocol/gates/G3.md)
  image_digest: "docker.io/library/python@sha256:82abc9f53600280b0757126f83c5a7d47088592d2acb6b4c0b9e97f76865508c"
  replicas: 18
  rate_low_bytes_per_s: {audit: 42834.0, tetragon: 46233.5}          # worst-case H >= 3 at +20 %
  rate_moderate_bytes_per_s: {audit: 231303.5, tetragon: 249661.0}   # P(loss of oldest primary fact) = 0.5
  per_replica_exec_per_s: {L: 0.545, M: 2.946}
  per_replica_api_per_s: {L: 1.621, M: 9.393}
  calibration:                       # H for F1 ~ 2.0, 1.2, 0.8, 0.5 (Section 13)
    CAL1: {target_bytes_per_s: {audit: 115651.8, tetragon: 124830.5}, exec_per_s: 1.473, api_per_s: 4.624}
    CAL2: {target_bytes_per_s: {audit: 192752.9, tetragon: 208050.8}, exec_per_s: 2.455, api_per_s: 7.803}
    CAL3: {target_bytes_per_s: {audit: 289129.4, tetragon: 312076.2}, exec_per_s: 3.682, api_per_s: 11.778}
    CAL4: {target_bytes_per_s: {audit: 462607.1, tetragon: 499321.9}, exec_per_s: 5.892, api_per_s: 18.933}

stores:                      # Section 4.3 rule; k >= 1 required
  audit: {max_size_mb: 10, max_backups: 1, max_age_days: 365, compress: false}   # set 2026-10-26, G3 decision 1
  tetragon: {max_size_mb: 10, max_backups: 1, rotation_interval: disabled}
  reference_observer: {audit_webhook: true, tetragon_grpc: true}   # G3: drop-free in every Q run
  capacity_rationale: "M = 10 MiB: Tetragon Helm chart 1.7.1 default export file size, used for both sources. k reduced from the chart default 5 to 1 under Section 4.3 item 4: the largest k whose highest required rate (Q-c and calibration, H ~ 0.5: 341 API GET/s, 106 exec/s) lies inside the envelope measured in load_map.json (400 GET/s, 200 exec/s); k = 5, 3, 2 need 1257, 799, 570 GET/s. Decided from load-map metadata only, before any Q run."

design:                      # locked
  cells: [LC, LD, MC, MD]
  controls_per_block: 1
  b_max: 24
  n_blocks: "<G5>"
  master_seed: "<G5>"
  pilot_blocks: 3
  qualification: {q_a_runs: 12, q_b_runs: 12, q_c_rates: 3, q_c_runs_per_rate: 3}
  calibration: {rates: 4, runs_per_rate: 4, target_h_f1: [2.0, 1.2, 0.8, 0.5]}

analysis:                    # locked
  alpha: 0.05
  minimally_important_effect: 0.25
  randomization_draws: 100000
  exact_limit_assignments: 1000000
  fallback_min_nonzero_blocks: 5
  power:
    search: {b_values: [6, 8, 10, 12, 14, 16, 20, 24], sigma_b: [0.0, 0.5, 1.0], n_sims: 1000, n_draws: 1000}
    confirm: {n_sims: 2000, n_draws: 2000, null_type1_band: [0.035, 0.065]}
    rule: {primary_scenario: pilot_informed, conservative_scenario: conservative, sigma_b: 0.5, target_primary: 0.80, target_conservative: 0.70}

host:                        # Section 14
  capacity_run_min: 20
  capacity_runs:                     # Section 14.2 (change log 2026-10-26)
    G1: provisional_ceiling          # every replica at its maximum configured rates
    G3: highest_calibration_rate     # predicted H ~ 0.5 for F1; both runs must pass
  timestamp_source: python_time_ns_and_monotonic_ns   # never shell date (Section 14.1)
  fingerprint_stable_hash: b64c25cd6d3d7e7ba98fc2077208422ff0b257568c438206b77fb9ba17c4a55f   # G3 cluster, platform-only, collected as root (2026-10-27); a change stops execution (10.4)
  peak_memory_max_fraction: 0.75
  preaction_memory_min_fraction: 0.30
  disk_free_min: "3 x package_size + 10 GB"
  disk_free_min_bytes: 10281850354   # G4: 3 x largest pilot package (93,950,118 B) + 10 GB
  stop_after_consecutive_oom: 2

stop_rules:                  # Section 10.4, locked
  abort_unscorable_ceiling_per_cell_fraction: 0.15
  abort_unscorable_ceiling_per_cell_per_block: 2
  max_collector_failure_imbalance: 3
