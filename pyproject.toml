[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frx"
version = "0.1.0"
description = "Forensic fact recoverability after pod termination — protocol tools (Blueprint v3.0)"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.11", "PyYAML>=6.0", "jsonschema>=4.20"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
frx = "frx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
