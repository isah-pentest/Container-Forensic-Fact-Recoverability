# Tetragon Helm values (Blueprint v3.0, Sections 3.1, 6.3). Confirm every key name against the
# pinned chart version at G1 and record it in software/source_config_reference.md.
tetragon:
  exportDirectory: /var/run/cilium/tetragon
  exportFilename: tetragon.log
  exportFileMaxSizeMB: "<G3: M_tetragon in MB>"
  exportFileMaxBackups: "<G3: k_tetragon, >= 1>"
  exportFileCompress: false
  exportFileRotationInterval: 0s        # time-based rotation disabled
  exportAllowList: |-
    {"event_set":["PROCESS_EXEC", "PROCESS_EXIT"]}
  enableProcessCred: false
  enableProcessNs: false
export:
  mode: ""                              # no stdout sidecar; the file is the source-side store
